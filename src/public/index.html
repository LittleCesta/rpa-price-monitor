<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Price Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f11;
      --surface: #16181c;
      --surface2: #1e2126;
      --border: #2a2d35;
      --border2: #363a45;
      --text: #e8eaf0;
      --muted: #6b7280;
      --accent: #4ade80;
      --accent-dim: rgba(74, 222, 128, 0.1);
      --accent-border: rgba(74, 222, 128, 0.3);
      --warn: #fbbf24;
      --warn-dim: rgba(251, 191, 36, 0.1);
      --danger: #f87171;
      --danger-dim: rgba(248, 113, 113, 0.1);
      --info: #60a5fa;
      --info-dim: rgba(96, 165, 250, 0.1);
      --mono: 'DM Mono', monospace;
      --sans: 'DM Sans', sans-serif;
      --radius: 10px;
      --radius-sm: 6px;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── Layout ── */
    .layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 0.5rem;
    }

    .logo-icon {
      width: 32px; height: 32px;
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    .logo-text { font-size: 15px; font-weight: 500; letter-spacing: -0.02em; }
    .logo-sub { font-size: 11px; color: var(--muted); font-family: var(--mono); }

    .nav { display: flex; flex-direction: column; gap: 2px; }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      font-size: 13px;
    }

    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--accent-dim); color: var(--accent); }
    .nav-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    .sidebar-footer {
      margin-top: auto;
      padding: 0.75rem;
      background: var(--surface2);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; margin-right: 6px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .status-text { font-size: 12px; color: var(--muted); font-family: var(--mono); }

    /* ── Main ── */
    .main { padding: 2rem; overflow-y: auto; }

    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .page-title { font-size: 20px; font-weight: 500; letter-spacing: -0.03em; }
    .page-sub { font-size: 12px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }

    /* ── Stats ── */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 2rem; }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
    }

    .stat-label { font-size: 11px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 300; font-family: var(--mono); letter-spacing: -0.04em; }
    .stat-value.green { color: var(--accent); }
    .stat-value.amber { color: var(--warn); }

    /* ── Controls ── */
    .controls { display: flex; gap: 10px; margin-bottom: 1.5rem; align-items: center; }

    .search-wrap { position: relative; flex: 1; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; }
    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 12px 9px 36px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--border2); }

    .filter-group { display: flex; gap: 6px; }
    .filter-btn {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-family: var(--mono);
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover { border-color: var(--border2); color: var(--text); }
    .filter-btn.active { border-color: var(--accent-border); background: var(--accent-dim); color: var(--accent); }

    .btn-add {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--accent-border);
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 13px;
      font-family: var(--sans);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-add:hover { background: rgba(74, 222, 128, 0.18); }

    /* ── Products ── */
    .products { display: flex; flex-direction: column; gap: 8px; }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: center;
      transition: border-color 0.15s;
    }

    .product-card:hover { border-color: var(--border2); }
    .product-card.below-target { border-left: 3px solid var(--accent); }

    .product-left { min-width: 0; }

    .product-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .product-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .badge {
      font-size: 10px;
      font-family: var(--mono);
      padding: 2px 8px;
      border-radius: 99px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge-alert { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent-border); }
    .badge-warn { background: var(--warn-dim); color: var(--warn); border: 1px solid rgba(251,191,36,0.3); }
    .badge-neutral { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

    .product-meta { display: flex; align-items: center; gap: 1.5rem; }

    .meta-item { }
    .meta-label { font-size: 10px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
    .meta-value { font-size: 16px; font-weight: 400; font-family: var(--mono); }
    .meta-value.current { color: var(--accent); }
    .meta-value.target { color: var(--info); }
    .meta-value.danger { color: var(--danger); }

    .meta-divider { width: 1px; height: 28px; background: var(--border); }

    .site-tag { font-size: 10px; color: var(--muted); font-family: var(--mono); margin-left: auto; }

    /* ── Sparkline ── */
    .sparkline { display: flex; align-items: flex-end; gap: 2px; height: 28px; }
    .spark-bar { width: 6px; border-radius: 2px; transition: opacity 0.15s; }
    .spark-bar:hover { opacity: 0.7; }

    /* ── Right actions ── */
    .product-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }

    .btn-detail {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-family: var(--mono);
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-detail:hover { border-color: var(--border2); color: var(--text); }

    .btn-delete {
      padding: 6px 10px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-delete:hover { color: var(--danger); border-color: var(--danger-dim); background: var(--danger-dim); }

    .last-check { font-size: 10px; color: var(--muted); font-family: var(--mono); }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 2rem;
      width: 480px;
      max-width: 95vw;
    }

    .modal-title { font-size: 16px; font-weight: 500; margin-bottom: 1.5rem; }

    .form-group { margin-bottom: 1rem; }
    .form-label { font-size: 11px; font-family: var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 6px; }
    .form-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus { border-color: var(--accent-border); }

    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 1.5rem; }
    .btn-cancel { padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; }
    .btn-save { padding: 8px 16px; border: 1px solid var(--accent-border); border-radius: var(--radius-sm); background: var(--accent-dim); color: var(--accent); font-size: 13px; cursor: pointer; }

    /* ── History panel ── */
    .history-panel {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: flex-end;
    }
    .history-panel.open { display: flex; }

    .history-content {
      background: var(--surface);
      border-left: 1px solid var(--border2);
      width: 420px;
      height: 100%;
      padding: 2rem;
      overflow-y: auto;
    }

    .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .history-title { font-size: 15px; font-weight: 500; }
    .btn-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; }

    .history-list { display: flex; flex-direction: column; gap: 6px; }
    .history-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px;
      background: var(--surface2);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .history-date { font-size: 11px; color: var(--muted); font-family: var(--mono); }
    .history-price { font-size: 14px; font-family: var(--mono); font-weight: 500; }
    .history-price.below { color: var(--accent); }

    /* ── Empty / loading ── */
    .empty { text-align: center; padding: 4rem 2rem; color: var(--muted); font-family: var(--mono); font-size: 13px; }
    .loading { text-align: center; padding: 2rem; color: var(--muted); font-family: var(--mono); font-size: 12px; }
  </style>
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">⬡</div>
      <div>
        <div class="logo-text">Price Monitor</div>
        <div class="logo-sub">v1.0.0</div>
      </div>
    </div>

    <nav class="nav">
      <div class="nav-item active">
        <div class="nav-dot"></div>
        Produtos
      </div>
      <div class="nav-item" style="opacity:0.4; cursor:default;">
        <div class="nav-dot"></div>
        Histórico
      </div>
      <div class="nav-item" style="opacity:0.4; cursor:default;">
        <div class="nav-dot"></div>
        Alertas
      </div>
    </nav>

    <div class="sidebar-footer">
      <div style="display:flex; align-items:center; margin-bottom:6px;">
        <span class="status-dot"></span>
        <span class="status-text">RPA ativo</span>
      </div>
      <div class="status-text" id="last-run">Última execução: —</div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="page-header">
      <div>
        <div class="page-title">Produtos monitorados</div>
        <div class="page-sub" id="subtitle">carregando...</div>
      </div>
      <button class="btn-add" onclick="openModal()">
        + Novo produto
      </button>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Total monitorado</div>
        <div class="stat-value" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Abaixo do alvo</div>
        <div class="stat-value green" id="stat-below">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Checagens hoje</div>
        <div class="stat-value amber" id="stat-alerts">—</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" class="search-input" placeholder="Buscar produto..." id="search-input" oninput="filterProducts()" />
      </div>
      <div class="filter-group">
        <button class="filter-btn active" onclick="setFilter('todos', this)">todos</button>
        <button class="filter-btn" onclick="setFilter('Mercado Livre', this)">mercado livre</button>
        <button class="filter-btn" onclick="setFilter('Amazon', this)">amazon</button>
      </div>
    </div>

    <!-- Products list -->
    <div class="products" id="products-list">
      <div class="loading">carregando produtos...</div>
    </div>
  </main>
</div>

<!-- Modal novo produto -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title">Novo produto</div>
    <div class="form-group">
      <label class="form-label">Nome do produto</label>
      <input type="text" class="form-input" id="form-name" placeholder="Ex: Máscara Capilar Morte Súbita" />
    </div>
    <div class="form-group">
      <label class="form-label">URL completa</label>
      <input type="text" class="form-input" id="form-url" placeholder="https://www.mercadolivre.com.br/..." />
    </div>
    <div class="form-group">
      <label class="form-label">Preço alvo (R$)</label>
      <input type="number" class="form-input" id="form-price" placeholder="Ex: 49.90" step="0.01" />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveProduct()">Salvar produto</button>
    </div>
  </div>
</div>

<!-- Painel de histórico -->
<div class="history-panel" id="history-panel">
  <div class="history-content">
    <div class="history-header">
      <div class="history-title" id="history-product-name">Histórico</div>
      <button class="btn-close" onclick="closeHistory()">✕</button>
    </div>
    <div class="history-list" id="history-list">
      <div class="loading">carregando...</div>
    </div>
  </div>
</div>

<script>
  let allProducts = []
  let activeFilter = 'todos'

  async function loadStats() {
    try {
      const res = await fetch('/api/stats')
      const data = await res.json()
      document.getElementById('stat-total').textContent = data.total
      document.getElementById('stat-below').textContent = data.belowTarget
      document.getElementById('stat-alerts').textContent = data.alertsToday
    } catch (e) {}
  }

  async function loadProducts() {
    try {
      const res = await fetch('/api/products')
      allProducts = await res.json()

      const now = new Date()
      document.getElementById('subtitle').textContent =
        `${allProducts.length} produto(s) · atualizado às ${now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`

      const lastChecks = allProducts.map(p => p.lastChecked).filter(Boolean)
      if (lastChecks.length > 0) {
        const latest = new Date(Math.max(...lastChecks.map(d => new Date(d))))
        document.getElementById('last-run').textContent =
          'Última execução: ' + latest.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
      }

      renderProducts()
    } catch (e) {
      document.getElementById('products-list').innerHTML =
        '<div class="empty">Erro ao carregar produtos.</div>'
    }
  }

  function renderProducts() {
    const search = document.getElementById('search-input').value.toLowerCase()

    const filtered = allProducts.filter(p => {
      const matchSearch = p.name.toLowerCase().includes(search)
      const matchFilter = activeFilter === 'todos' || p.site === activeFilter
      return matchSearch && matchFilter
    })

    const list = document.getElementById('products-list')

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">Nenhum produto encontrado.</div>'
      return
    }

    list.innerHTML = filtered.map(p => {
      const badge = p.belowTarget
        ? `<span class="badge badge-alert">● abaixo do alvo</span>`
        : `<span class="badge badge-neutral">monitorando</span>`

      const currentClass = p.belowTarget ? 'current' : (p.currentPrice > p.targetPrice ? 'danger' : '')
      const currentPrice = p.currentPrice !== null
        ? `R$ ${p.currentPrice.toFixed(2).replace('.', ',')}`
        : '—'

      const change = p.priceChange !== null
        ? (p.priceChange > 0 ? `▲ ${p.priceChange}%` : `▼ ${Math.abs(p.priceChange)}%`)
        : ''
      const changeColor = p.priceChange < 0 ? 'color: var(--accent)' : 'color: var(--danger)'

      const lastChecked = p.lastChecked
        ? new Date(p.lastChecked).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
        : '—'

      return `
        <div class="product-card ${p.belowTarget ? 'below-target' : ''}">
          <div class="product-left">
            <div class="product-top">
              <span class="product-name">${p.name}</span>
              ${badge}
              <span class="site-tag">${p.site}</span>
            </div>
            <div class="product-meta">
              <div class="meta-item">
                <div class="meta-label">Preço atual</div>
                <div class="meta-value ${currentClass}">${currentPrice}</div>
              </div>
              <div class="meta-divider"></div>
              <div class="meta-item">
                <div class="meta-label">Preço alvo</div>
                <div class="meta-value target">R$ ${p.targetPrice.toFixed(2).replace('.', ',')}</div>
              </div>
              <div class="meta-divider"></div>
              <div class="meta-item">
                <div class="meta-label">Variação 24h</div>
                <div class="meta-value" style="${changeColor}">${change || '—'}</div>
              </div>
            </div>
          </div>
          <div class="product-right">
            <div style="display:flex; gap:6px;">
              <button class="btn-detail" onclick="openHistory('${p._id}', '${p.name.replace(/'/g, "\\'")}')">histórico</button>
              <button class="btn-delete" onclick="deleteProduct('${p._id}', '${p.name.replace(/'/g, "\\'")}')">✕</button>
            </div>
            <div class="last-check">${lastChecked}</div>
          </div>
        </div>
      `
    }).join('')
  }

  function filterProducts() { renderProducts() }

  function setFilter(filter, btn) {
    activeFilter = filter
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    renderProducts()
  }

  function openModal() {
    document.getElementById('modal').classList.add('open')
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open')
    document.getElementById('form-name').value = ''
    document.getElementById('form-url').value = ''
    document.getElementById('form-price').value = ''
  }

  async function saveProduct() {
    const name = document.getElementById('form-name').value.trim()
    const url = document.getElementById('form-url').value.trim()
    const targetPrice = parseFloat(document.getElementById('form-price').value)

    if (!name || !url || isNaN(targetPrice)) {
      alert('Preencha todos os campos corretamente.')
      return
    }

    try {
      const res = await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, url, targetPrice }),
      })

      if (!res.ok) {
        const err = await res.json()
        alert(err.error)
        return
      }

      closeModal()
      loadProducts()
      loadStats()
    } catch (e) {
      alert('Erro ao salvar produto.')
    }
  }

  async function deleteProduct(id, name) {
    if (!confirm(`Remover "${name}"?`)) return

    try {
      await fetch(`/api/products/${id}`, { method: 'DELETE' })
      loadProducts()
      loadStats()
    } catch (e) {
      alert('Erro ao remover produto.')
    }
  }

  async function openHistory(id, name) {
    document.getElementById('history-product-name').textContent = name
    document.getElementById('history-panel').classList.add('open')
    document.getElementById('history-list').innerHTML = '<div class="loading">carregando...</div>'

    try {
      const res = await fetch(`/api/products/${id}/history`)
      const history = await res.json()

      if (history.length === 0) {
        document.getElementById('history-list').innerHTML =
          '<div class="empty">Nenhum histórico ainda.</div>'
        return
      }

      const target = allProducts.find(p => p._id === id)?.targetPrice ?? Infinity

      document.getElementById('history-list').innerHTML = history.map(h => {
        const date = new Date(h.scrapedAt).toLocaleString('pt-BR', {
          day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
        })
        const below = h.price <= target
        return `
          <div class="history-item">
            <span class="history-date">${date}</span>
            <span class="history-price ${below ? 'below' : ''}">R$ ${h.price.toFixed(2).replace('.', ',')}</span>
          </div>
        `
      }).join('')
    } catch (e) {
      document.getElementById('history-list').innerHTML = '<div class="empty">Erro ao carregar histórico.</div>'
    }
  }

  function closeHistory() {
    document.getElementById('history-panel').classList.remove('open')
  }

  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal')) closeModal()
  })

  document.getElementById('history-panel').addEventListener('click', (e) => {
    if (e.target === document.getElementById('history-panel')) closeHistory()
  })

  loadProducts()
  loadStats()
  setInterval(() => { loadProducts(); loadStats() }, 60000)
</script>

</body>
</html>
